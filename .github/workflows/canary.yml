name: canary

on:
  schedule:
    - cron: "23 7 * * *"   # once daily; avoid :00 so it doesn't pile up with everyone else's
  workflow_dispatch: {}     # dispatch manually at least once before trusting the badge

permissions:
  contents: read

jobs:
  # A real run against real tickers. Unlike this project's siblings, this
  # one needs no secret at all — the ticker page is free, public data
  # (see SECURITY.md) — so this canary runs unconditionally rather than
  # skipping behind an optional-secret gate.
  #
  # This is an availability canary. A crash or bad-usage exit (1/2) is a
  # real bug in this repo and fails the job. A live-site block from a
  # datacentre IP (exit 3) is useful diagnostic context, not a bug this
  # repo can fix by itself (see CONTRIBUTING.md) -- it's reported loudly
  # as a workflow warning annotation, with the run's meta.json still
  # uploaded, but does NOT fail the job or turn the badge red. That
  # matches CONTRIBUTING.md's contributor-facing description, which this
  # workflow did not actually implement until 2026-09-28 (canary run #1
  # hit a real datacentre-IP block on its very first live fire and failed
  # the job on it, contradicting that doc -- see CHANGELOG.md). A green
  # badge therefore means "ran without crashing", not "definitely got
  # through to real data" -- check the uploaded meta.json artifact for
  # that. Zero-products/remote-api-error/partial (4/5/6) still fail the
  # job: unlike a block, those can also mean this repo's own parser or
  # wiring broke, not just an external condition.
  canary-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install -r requirements-playwright.txt
          playwright install --with-deps chromium

      - name: Verify the captured robots rules are still current
        run: |
          curl --fail --silent --show-error https://www.tipranks.com/robots.txt -o /tmp/tipranks-robots.txt
          python3 -c "
          from pathlib import Path
          from tipranks_parser import ROBOTS_TXT_CAPTURE, parse_robots_rules
          captured = parse_robots_rules(ROBOTS_TXT_CAPTURE)
          live = parse_robots_rules(Path('/tmp/tipranks-robots.txt').read_text())
          if captured != live:
              raise SystemExit('robots.txt Allow/Disallow rules changed; refresh and review the capture')
          print('robots.txt rules match the reviewed capture')
          "

      - name: Scrape a handful of real tickers
        run: |
          set +e
          python3 playwright_scraper.py \
            --ticker AAPL --ticker MSFT --ticker GOOGL \
            --format json --out canary_out.json --allow-empty
          echo "exit_code=$?" >> "$GITHUB_ENV"

      - name: Validate the live result
        id: validate
        run: |
          python3 -c "
          import json, os, sys

          code = int(os.environ['exit_code'])
          print(f'playwright_scraper.py exited {code}')

          if code in (1, 2):
              print(f'::error::exit {code} means crashed or bad usage — a real bug, not a site condition')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as gh_out:
                  print('verdict=bug', file=gh_out)
              sys.exit(0)

          meta = json.load(open('canary_out.json.meta.json'))
          print(json.dumps(meta, indent=2))

          if code == 0:
              assert meta['status'] == 'complete'
              assert meta['rating_count'] >= 1
              print(f\"canary: got {meta['rating_count']} real ratings\")
              verdict = 'ok'
          elif code == 3:
              # A datacentre-IP block is a site condition, not a bug this
              # repo can fix on its own — see CONTRIBUTING.md and this
              # job's own top-level comment. Reported loudly, doesn't fail.
              print(f\"::warning::live scrape blocked (datacentre IP): exit=3, status={meta.get('status')}, failed={meta.get('failed_tickers')} — see canary_out.json.meta.json in this run's uploaded artifact\")
              verdict = 'blocked'
          else:
              print(f\"::error::live scrape unavailable: exit={code}, status={meta.get('status')}, failed={meta.get('failed_tickers')}\")
              verdict = 'bug'

          with open(os.environ['GITHUB_OUTPUT'], 'a') as gh_out:
              print(f'verdict={verdict}', file=gh_out)
          "

      - name: Fail the job on a real bug (never on a reported datacentre-IP block)
        if: steps.validate.outputs.verdict == 'bug'
        run: exit 1

      - name: Upload the run's output on every attempt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canary-live-${{ github.run_id }}
          path: |
            canary_out.json
            canary_out.json.meta.json
          retention-days: 14
