name: Claude Code Review

# Automated first-pass review on every PR. Extra, on top of the core
# tests.yml/canary.yml split that actually gates merges — same
# token-guard and stable-channel reasoning as claude.yml, see the
# comments there.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check token is configured
        id: token_check
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: echo "has_token=$HAS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code CLI (stable channel)
        if: steps.token_check.outputs.has_token == 'true'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s stable
          echo "CLAUDE_CODE_PATH=$HOME/.local/bin/claude" >> "$GITHUB_ENV"

      - uses: anthropics/claude-code-action@v1
        if: steps.token_check.outputs.has_token == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: ${{ env.CLAUDE_CODE_PATH }}
          prompt: |
            Review this PR against the repository's documented contracts in
            README.md, TESTING.md, CONTRIBUTING.md, and output_writer.py.
            Pay special attention to preventing empty output from replacing
            valid data, keeping blocked/partial/empty/error states distinct,
            and that all three engines (Playwright/Selenium/Puppeteer) stay
            in parity on CLI flags, exit codes, and the TickerRating schema.
            Flag any change to tipranks_parser.py that isn't backed by a
            real captured fixture, and any new field or engine behavior
            without matching coverage in smoke_test.py.
